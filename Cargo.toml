[workspace]
resolver = "3"
members = ["crates/solver", "crates/solver-wasm", "services/api"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
echidna-solver = { path = "crates/solver" }
wasm-bindgen = "0.2"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }

[profile.release.package.echidna-solver-wasm]
opt-level = "s"
