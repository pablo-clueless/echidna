[workspace]
resolver = "3"
members = ["crates/solver", "crates/solver-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
echidna-solver = { path = "crates/solver" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
thiserror = "2"

[profile.release.package.echidna-solver-wasm]
opt-level = "s"
